services:
  api:
    build:
      context: .
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      ETCD_ENDPOINTS: ${ETCD_ENDPOINTS:-http://etcd:2379}
      # Available to an external SecretStore configured with
      # tokenEnvironmentVariable: OPENBAO_TOKEN.
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-}
    ports:
      - "0.0.0.0:8080:8080"
    init: true
