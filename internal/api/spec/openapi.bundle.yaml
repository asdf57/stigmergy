info:
    description: Homelab API
    title: Homelab Control Plane API
    version: 0.1.0
openapi: 3.1.0
paths:
    /api/v1alpha1/git-repositories:
        delete:
            operationId: deleteGitRepositorys
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteCollectionResult'
                    description: Resources deleted
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Resource store request failed
            summary: Delete all GitRepository resources
            tags:
                - GitRepositorys
        get:
            operationId: listGitRepositorys
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GitRepositoryList'
                    description: Resource list at one storage revision
                    headers:
                        X-Resource-Version:
                            description: Storage revision used for the list
                            schema:
                                type: string
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Resource store request failed
            summary: List GitRepository resources
            tags:
                - GitRepositorys
        post:
            operationId: createGitRepository
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GitRepositoryCreate'
                    application/x-yaml:
                        schema:
                            $ref: '#/components/schemas/GitRepositoryCreate'
                    application/yaml:
                        schema:
                            $ref: '#/components/schemas/GitRepositoryCreate'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GitRepository'
                    description: Resource
                    headers:
                        ETag:
                            description: Quoted storage modification revision
