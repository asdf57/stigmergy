# Command is an immutable, one-shot execution request.
x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: Command
  plural: commands
  spec-schema: CommandSpec
  status-schema: CommandStatus
  immutable-spec: true
  operations: [create, list, get, put, patch, delete, delete-collection]
  finalizers: [homelab.io/command-cleanup]

CommandSpec:
  type: object
  additionalProperties: false
  required: [commandsPipelineRef, script]
  description: Immutable after creation. Create a new Command to run again.
  properties:
    commandsPipelineRef:
      $ref: '#/components/schemas/CommandExecutorReference'
    script: {type: string, minLength: 1}
    ttlSecondsAfterFinished:
      type: integer
      format: int64
      minimum: 0
      maximum: 2147483647
      description: Delete after completion and this delay; omitted retains the execution.

CommandExecutorReference:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name: {type: string, minLength: 1}
    uid: {type: string, minLength: 1}

CommandExecutionSnapshot:
  type: object
  additionalProperties: false
  required: [executorUID, repository, provider, providerUID, providerName, branch, definition]
  properties:
    executorUID: {type: string}
    repository:
      $ref: '#/components/schemas/GitRepositorySpec'
    provider:
      $ref: '#/components/schemas/PipelineProviderSpec'
    providerUID: {type: string}
    providerName: {type: string}
    branch: {type: string}
    definition: {type: string}

CommandStatus:
  type: object
  additionalProperties: false
  properties:
    phase:
      type: string
      enum: [Pending, Dispatching, Running, Succeeded, Failed]
    observedGeneration: {type: integer, format: int64, minimum: 0}
    snapshot:
      $ref: '#/components/schemas/CommandExecutionSnapshot'
    pipelineRef:
      $ref: '#/components/schemas/ResourceReference'
    revision: {type: string}
    buildID: {type: integer, format: int64, minimum: 1}
    dispatchAfterBuildID: {type: integer, format: int64, minimum: 0}
    completedAt: {type: string, format: date-time}
    conditions:
      type: array
      items:
        $ref: '#/components/schemas/CommandCondition'

CommandCondition:
  type: object
  additionalProperties: false
  required: [type, status, reason]
  properties:
    type: {type: string, minLength: 1}
    status:
      type: string
      enum: ['True', 'False', Unknown]
    reason: {type: string, minLength: 1}
    message: {type: string}
    observedGeneration: {type: integer, format: int64, minimum: 0}
