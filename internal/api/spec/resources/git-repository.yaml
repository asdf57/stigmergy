# GitRepository describes a Git destination used by publication controllers.
x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: GitRepository
  plural: git-repositories
  spec-schema: GitRepositorySpec
  status-schema: GitRepositoryStatus
  operations: [create, list, get, put, patch, delete, delete-collection]

GitRepositorySpec:
  type: object
  additionalProperties: false
  required: [url]
  properties:
    url:
      type: string
      minLength: 1
    authentication:
      $ref: '#/components/schemas/GitRepositoryAuthentication'
    commit:
      $ref: '#/components/schemas/GitRepositoryCommitSpec'

GitRepositoryAuthentication:
  type: object
  additionalProperties: false
  required: [sshKeyPairRef]
  properties:
    sshKeyPairRef:
      type: string
      minLength: 1

GitRepositoryCommitSpec:
  type: object
  additionalProperties: false
  properties:
    authorName: {type: string, minLength: 1}
    authorEmail: {type: string, minLength: 1}
    messageTemplate: {type: string, minLength: 1}

GitRepositoryStatus:
  type: object
  additionalProperties: false
  properties:
    phase: {type: string}
    observedGeneration: {type: integer, format: int64, minimum: 0}
    conditions:
      type: array
      items:
        $ref: '#/components/schemas/GitRepositoryCondition'

GitRepositoryCondition:
  type: object
  additionalProperties: false
  required: [type, status, reason]
  properties:
    type: {type: string, minLength: 1}
    status:
      type: string
      enum: ['True', 'False', Unknown]
    reason: {type: string, minLength: 1}
    message: {type: string}
    observedGeneration: {type: integer, format: int64, minimum: 0}
