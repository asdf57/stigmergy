# InventoryPublication renders one capture group as an owned artifact directory.
x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: InventoryPublication
  plural: inventory-publications
  spec-schema: InventoryPublicationSpec
  status-schema: InventoryPublicationStatus
  operations: [create, list, get, put, patch, delete, delete-collection]

InventoryPublicationSpec:
  type: object
  additionalProperties: false
  required: [inventoryCaptureGroupRef, destinationRef, target]
  properties:
    inventoryCaptureGroupRef:
      $ref: '#/components/schemas/InventoryPublicationCaptureGroupReference'
    destinationRef:
      $ref: '#/components/schemas/InventoryPublicationDestinationReference'
    target:
      $ref: '#/components/schemas/InventoryPublicationTarget'
    policy:
      $ref: '#/components/schemas/InventoryPublicationPolicy'

InventoryPublicationCaptureGroupReference:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name: {type: string, minLength: 1}

InventoryPublicationDestinationReference:
  type: object
  additionalProperties: false
  required: [apiVersion, kind, name]
  properties:
    apiVersion: {type: string, minLength: 1}
    kind: {type: string, minLength: 1}
    name: {type: string, minLength: 1}

InventoryPublicationTarget:
  type: object
  additionalProperties: false
  required: [branch, rootPath, layout, inventoryFile]
  properties:
    branch:
      type: string
      minLength: 1
    rootPath:
      type: string
      minLength: 1
    layout:
      type: string
      enum: [ansible-directory]
    inventoryFile:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*\.ya?ml$'

InventoryPublicationPolicy:
  type: object
  additionalProperties: false
  properties:
    requireReady: {type: boolean}

InventoryPublicationStatus:
  type: object
  additionalProperties: false
  properties:
    phase: {type: string}
    observedGeneration: {type: integer, format: int64, minimum: 0}
    observedArtifactDigest: {type: string}
    lastPublishedTime: {type: string, format: date-time}
    source:
      $ref: '#/components/schemas/InventoryPublicationSourceStatus'
    destination:
      $ref: '#/components/schemas/InventoryPublicationDestinationStatus'
    artifacts:
      type: array
      items:
        $ref: '#/components/schemas/InventoryPublicationArtifactStatus'
    conditions:
      type: array
      items:
        $ref: '#/components/schemas/InventoryPublicationCondition'

InventoryPublicationSourceStatus:
  type: object
  additionalProperties: false
  required: [inventoryCaptureGroupUID, observedGeneration, digest]
  properties:
    inventoryCaptureGroupUID: {type: string, minLength: 1}
    observedGeneration: {type: integer, format: int64, minimum: 0}
    digest: {type: string, minLength: 1}

InventoryPublicationArtifactStatus:
  type: object
  additionalProperties: false
  required: [path, digest]
  properties:
    path: {type: string, minLength: 1}
    digest: {type: string, minLength: 1}

InventoryPublicationDestinationStatus:
  type: object
  additionalProperties: false
  required: [repositoryUID, observedRepositoryGeneration, branch, revision]
  properties:
    repositoryUID: {type: string, minLength: 1}
    observedRepositoryGeneration: {type: integer, format: int64, minimum: 0}
    branch: {type: string, minLength: 1}
    revision: {type: string, minLength: 1}
    url: {type: string}

InventoryPublicationCondition:
  type: object
  additionalProperties: false
  required: [type, status, reason]
  properties:
    type: {type: string, minLength: 1}
    status:
      type: string
      enum: ['True', 'False', Unknown]
    reason: {type: string, minLength: 1}
    message: {type: string}
    observedGeneration: {type: integer, format: int64, minimum: 0}
