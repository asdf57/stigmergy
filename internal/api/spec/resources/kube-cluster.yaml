x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: KubeCluster
  plural: kube-clusters
  spec-schema: KubeClusterSpec
  status-schema: KubeClusterStatus
  operations: [create, list, get, put, patch, delete]

# Settings only. Configuration playbooks own bootstrap and verification.
KubeClusterSpec:
  type: object
  additionalProperties: false
  required: [kubernetesVersion, containerdVersion, controlPlaneEndpoint, podCIDR, serviceCIDR, network]
  properties:
    kubernetesVersion: {type: string, pattern: '^1\.[0-9]+\.[0-9]+$'}
    containerdVersion: {type: string, pattern: '^[12]\.[0-9]+\.[0-9]+$'}
    runcVersion: {type: string, pattern: '^1\.[0-9]+\.[0-9]+$'}
    cniPluginsVersion: {type: string, pattern: '^1\.[0-9]+\.[0-9]+$'}
    controlPlaneEndpoint: {type: string, minLength: 1}
    podCIDR: {type: string, minLength: 1}
    serviceCIDR: {type: string, minLength: 1}
    network:
      type: object
      additionalProperties: false
      required: [provider, version]
      properties:
        provider: {type: string, minLength: 1}
        version: {type: string, minLength: 1}

KubeClusterStatus:
  type: object
  additionalProperties: false
  properties:
    observedGeneration: {type: integer, format: int64, minimum: 0}
    lastVerifiedAt: {type: string, format: date-time}
    configurationRef:
      $ref: '#/components/schemas/ResourceReference'
    configurationGeneration: {type: integer, format: int64, minimum: 0}
    inputRevision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    playbookRevision: {type: string, pattern: '^[0-9a-f]{40}$'}
    clusterNamespaceUID: {type: string, minLength: 1}
    controlPlaneEndpoint: {type: string, minLength: 1}
    kubernetesVersion: {type: string, minLength: 1}
    containerdVersion: {type: string, minLength: 1}
    podCIDR: {type: string, minLength: 1}
    serviceCIDR: {type: string, minLength: 1}
    network:
      type: object
      additionalProperties: false
      required: [provider, version]
      properties:
        provider: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
    checks:
      type: object
      additionalProperties: false
      required: [serviceDNS, podConnectivity]
      properties:
        serviceDNS: {type: boolean}
        podConnectivity: {type: boolean}
    nodes:
      type: array
      items:
        $ref: '#/KubeClusterNodeObservation'

KubeClusterNodeObservation:
  type: object
  additionalProperties: false
  required: [serverRef, nodeName, nodeUID, role, ready, internalIP, podCIDR, kubeletVersion, containerdVersion]
  properties:
    serverRef:
      $ref: '#/components/schemas/ResourceReference'
    nodeName: {type: string, minLength: 1}
    nodeUID: {type: string, minLength: 1}
    role: {type: string, enum: [control-plane, worker]}
    ready: {type: boolean}
    internalIP: {type: string, minLength: 1}
    podCIDR: {type: string, minLength: 1}
    kubeletVersion: {type: string, minLength: 1}
    containerdVersion: {type: string, minLength: 1}
    operatingSystem: {type: string}
    kernelVersion: {type: string}
