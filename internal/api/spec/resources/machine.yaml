# Machine is the stable inventory resource discovered from a MachineReport.
x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: Machine
  plural: machines
  spec-schema: MachineSpec
  operations: [create, list, get, put, delete, delete-collection]

MachineSpec:
  type: object
  additionalProperties: false
  required:
    - location
    - observed_at
    - storage
    - system
    - cpu
    - interfaces
    - lldp_info
  properties:
    location:
      $ref: '#/components/schemas/MachineLocation'
    observed_at:
      type: string
      format: date-time
    storage:
      type: array
      items:
        $ref: '#/components/schemas/MachineReportStorageDevice'
    system:
      $ref: '#/components/schemas/MachineReportSystem'
    cpu:
      $ref: '#/components/schemas/MachineReportCPU'
    interfaces:
      type: array
      items:
        $ref: '#/components/schemas/MachineReportNetworkInterface'
    lldp_info:
      type: array
      x-go-name: LLDPInfo
      items:
        $ref: '#/components/schemas/MachineReportLLDPInterfaceGroup'

MachineLocation:
  type: object
  additionalProperties: false
  required:
    - lldp_port
    - switch_mac
  properties:
    lldp_port:
      type: string
    switch_mac:
      type: string
