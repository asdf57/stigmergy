# Pipeline declares provider-specific pipeline configuration and owns its external lifecycle.
x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: Pipeline
  plural: pipelines
  spec-schema: PipelineSpec
  status-schema: PipelineStatus
  operations: [create, list, get, put, patch, delete, delete-collection]
  finalizers: [homelab.io/pipeline-cleanup]

PipelineSpec:
  type: object
  additionalProperties: false
  required: [providerRef, externalName, definition]
  properties:
    providerRef:
      $ref: '#/components/schemas/PipelineProviderReference'
    externalName:
      type: string
      minLength: 1
    definition:
      $ref: '#/components/schemas/PipelineDefinition'

PipelineProviderReference:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name: {type: string, minLength: 1}

PipelineDefinition:
  type: object
  additionalProperties: false
  required: [format, data]
  properties:
    format:
      type: string
      enum: [concourse]
    data:
      type: string
      minLength: 1

PipelineStatus:
  type: object
  additionalProperties: false
  properties:
    phase:
      type: string
      enum: [Pending, Ready, Failed]
    observedGeneration: {type: integer, format: int64, minimum: 0}
    appliedDigest: {type: string}
    externalName: {type: string}
    conditions:
      type: array
      items:
        $ref: '#/components/schemas/PipelineCondition'

PipelineCondition:
  type: object
  additionalProperties: false
  required: [type, status, reason]
  properties:
    type: {type: string, minLength: 1}
    status:
      type: string
      enum: ['True', 'False', Unknown]
    reason: {type: string, minLength: 1}
    message: {type: string}
    observedGeneration: {type: integer, format: int64, minimum: 0}
