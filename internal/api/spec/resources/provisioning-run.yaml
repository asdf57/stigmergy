# A one-shot disk replacement request. Creation reserves the bound Server.
x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: ProvisioningRun
  plural: provisioning-runs
  spec-schema: ProvisioningRunSpec
  status-schema: ProvisioningRunStatus
  immutable-spec: true
  operations: [create, list, get, patch, delete]

ProvisioningRunSpec:
  type: object
  additionalProperties: false
  required: [serverRef, serverGeneration, machineRef, storage]
  properties:
    serverRef: {$ref: '#/components/schemas/ResourceReference'}
    serverGeneration:
      type: integer
      format: int64
      minimum: 1
      description: Desired Server generation reviewed when requesting replacement; stale requests conflict.
    machineRef: {$ref: '#/components/schemas/ResourceReference'}
    storage:
      type: object
      additionalProperties: false
      required: [disks]
      properties:
        disks:
          type: array
          minItems: 1
          maxItems: 1
          description: V1 supports exactly one system disk; creation explicitly authorizes replacement.
          items: {$ref: '#/ProvisioningRunDisk'}

ProvisioningRunDisk:
  type: object
  additionalProperties: false
  required: [deviceID, role]
  properties:
    deviceID: {type: string, pattern: '^(wwn|serial):[^\s]+$'}
    role: {type: string, enum: [system]}

ProvisioningRunStatus:
  type: object
  additionalProperties: false
  properties:
    phase: {type: string, enum: [Pending, PreparingBoot, AwaitingLive, Installing, AwaitingInstalled, Verifying, Succeeded, Blocked]}
    maintenance: {type: boolean}
    bootTarget: {type: string, enum: [live, installed]}
    sourceBootID: {type: string}
    liveBootID: {type: string}
    netbootArmed: {type: boolean}
    bootstrapPublicKey: {type: string}
    snapshot: {$ref: '#/ProvisioningRunSnapshot'}
    attemptID: {type: string}
    observedServerGeneration: {type: integer, format: int64, minimum: 0}
    currentStage: {type: string}
    startedAt: {type: string, format: date-time}
    completedAt: {type: string, format: date-time}
    backendRunID: {type: string}
    message: {type: string}
    selectedDisk: {$ref: '#/ProvisioningDiskIdentity'}

ProvisioningDiskIdentity:
  type: object
  additionalProperties: false
  required: [serial, wwn, size, model, tran]
  properties:
    serial: {type: string}
    wwn: {type: string}
    size: {type: integer, format: int64, minimum: 1}
    model: {type: string}
    tran: {type: string, enum: [sata, ata, nvme]}

ProvisioningRunSnapshot:
  type: object
  additionalProperties: false
  required: [serverUID, machineRef, keyPairRef, isoRef, authorityRef, trustBundleDigest, isoBuildID, distribution, artifacts, targetDisk, diskIdentity, bootMAC, inputs, codeRevision, planDigest]
  properties:
    serverUID: {type: string, minLength: 1}
    machineRef: {$ref: '#/components/schemas/ResourceReference'}
    keyPairRef: {$ref: '#/components/schemas/ResourceReference'}
    isoRef: {$ref: '#/components/schemas/ResourceReference'}
    authorityRef: {$ref: '#/components/schemas/ResourceReference'}
    trustBundleDigest: {type: string}
    isoBuildID: {type: string, minLength: 1}
    distribution: {type: string, enum: [arch, debian]}
    artifacts:
      type: array
      items: {$ref: '#/components/schemas/ISOArtifact'}
    targetDisk: {type: string, pattern: '^/dev/disk/by-id/[^/]+$'}
    diskIdentity: {$ref: '#/ProvisioningDiskIdentity'}
    bootMAC: {type: string, pattern: '^[a-f0-9]{2}(:[a-f0-9]{2}){5}$'}
    inputs: {type: object, additionalProperties: true}
    codeRevision: {type: string, minLength: 1}
    planDigest: {type: string, minLength: 1}
