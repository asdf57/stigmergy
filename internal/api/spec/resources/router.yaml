# ---
# apiVersion: homelab.io/v1alpha1
# kind: Router
# metadata:
#   name: mikrotik-1
# spec:
#   mgmtAddr: 10.0.0.1
#   authentication:
#     type: UsernamePasswordCredential
#     name: mikrotik-creds
#   type: Mikrotik

# Router declares a network router managed by a provider-specific controller.
x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: Router
  plural: routers
  spec-schema: RouterSpec
  status-schema: RouterStatus
  operations: [create, list, get, put, patch, delete, delete-collection]

RouterSpec:
  type: object
  additionalProperties: false
  required: [authentication, mgmtAddr, type]
  properties:
    authentication:
      $ref: '#/RouterAuthenticationReference'
    mgmtAddr:
      type: string
      minLength: 1
    type:
      type: string
      enum: [Mikrotik]
      x-enum-varnames: [RouterTypeMikrotik]
    addresses:
      type: array
      description: Omitted leaves addresses unmanaged; an empty list removes only safe entries owned by this Router UID. Exact preexisting unowned matches are preserved without adoption.
      items:
        $ref: '#/RouterAddress'

RouterAddress:
  type: object
  additionalProperties: false
  required: [name, address, network, interface]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
    address:
      type: string
      minLength: 1
      description: IPv4 interface address with prefix length; the host part is preserved.
    network:
      type: string
      minLength: 1
      description: IPv4 network address. An explicit peer network is permitted for /32 RouterOS point-to-point addressing.
    interface:
      type: string
      minLength: 1

RouterAuthenticationReference:
  type: object
  additionalProperties: false
  required: [type, name]
  properties:
    type:
      type: string
      enum: [UsernamePasswordCredential]
      x-enum-varnames: [RouterAuthenticationTypeUsernamePasswordCredential]
    name:
      type: string
      minLength: 1

RouterStatus:
  type: object
  additionalProperties: false
  properties:
    phase:
      type: string
      enum: [Pending, Ready, Failed]
    observedGeneration:
      type: integer
      format: int64
      minimum: 0
    conditions:
      type: array
      items:
        $ref: '#/RouterCondition'

RouterCondition:
  type: object
  additionalProperties: false
  required: [type, status, reason]
  properties:
    type: {type: string, minLength: 1}
    status:
      type: string
      enum: ['True', 'False', Unknown]
    reason: {type: string, minLength: 1}
    message: {type: string}
    observedGeneration: {type: integer, format: int64, minimum: 0}
