# SecretStore describes an external secret backend used by controllers.
x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: SecretStore
  plural: secret-stores
  spec-schema: SecretStoreSpec
  operations: [create, list, get, put, patch, delete, delete-collection]

SecretStoreSpec:
  type: object
  additionalProperties: false
  required: [provider]
  properties:
    provider:
      $ref: '#/components/schemas/SecretStoreProvider'

SecretStoreProvider:
  type: object
  additionalProperties: false
  minProperties: 1
  maxProperties: 1
  properties:
    openBao:
      $ref: '#/components/schemas/OpenBaoSecretStoreProvider'

OpenBaoSecretStoreProvider:
  type: object
  additionalProperties: false
  required: [address, kvV2Mount, authentication]
  properties:
    address:
      type: string
      format: uri
    kvV2Mount:
      type: string
      minLength: 1
      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
    keyPrefix:
      type: string
      minLength: 1
    authentication:
      $ref: '#/components/schemas/OpenBaoSecretStoreAuthentication'

OpenBaoSecretStoreAuthentication:
  type: object
  additionalProperties: false
  minProperties: 1
  maxProperties: 1
  properties:
    tokenEnvironmentVariable:
      type: string
      minLength: 1
      pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    tokenFile:
      type: string
      minLength: 1
      pattern: '^/.*$'
