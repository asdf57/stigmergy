x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: Secret
  plural: secrets
  spec-schema: SecretSpec
  status-schema: SecretStatus
  finalizers: [homelab.io/secret-cleanup]
  operations: [create, list, get, put, patch, delete, delete-collection]

SecretSpec:
  type: object
  additionalProperties: false
  required: [secretStoreRef, path, data]
  properties:
    secretStoreRef:
      $ref: '#/SecretStoreReference'
    path:
      type: string
    data:
      type: object
      additionalProperties:
        type: string

SecretStoreReference:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      minLength: 1

SecretStatus:
  type: object
  additionalProperties: false
  properties:
    phase:
      type: string
      enum: [Pending, Ready, Failed]
    observedGeneration:
      type: integer
      format: int64
      minimum: 0
    externalVersion:
      type: integer
      format: int64
      minimum: 1
    conditions:
      type: array
      items:
        $ref: '#/SecretCondition'

SecretCondition:
  type: object
  additionalProperties: false
  required: [type, status, reason]
  properties:
    type: {type: string, minLength: 1}
    status:
      type: string
      enum: ['True', 'False', Unknown]
    reason: {type: string, minLength: 1}
    message: {type: string}
    observedGeneration: {type: integer, format: int64, minimum: 0}
