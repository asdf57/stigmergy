# Server is the user-named desired host configuration bound to one discovered Machine.
x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: Server
  plural: servers
  spec-schema: ServerSpec
  status-schema: ServerStatus
  operations: [create, list, get, put, patch, delete, delete-collection]
  finalizers: [homelab.io/server-host-key-cleanup]

ServerSpec:
  type: object
  additionalProperties: false
  required: [machineSelector]
  properties:
    machineSelector:
      $ref: '#/components/schemas/ServerMachineSelector'
    boot: {$ref: '#/ServerBootSpec'}
    sshCertificateAuthorityRef: {$ref: '#/ServerDependencyReference'}
    hostName: {type: string, minLength: 1}
    domainName: {type: string, minLength: 1}
    operatingSystem:
      $ref: '#/components/schemas/ServerOperatingSystem'
    users:
      type: array
      items:
        $ref: '#/components/schemas/ServerUser'
    groups:
      type: array
      items: {type: string}
    packages:
      type: array
      items: {type: string}
    sysctls:
      type: object
      additionalProperties: {type: string}
    featureFlags:
      $ref: '#/components/schemas/ServerFeatureFlags'
    provisioning:
      $ref: '#/components/schemas/ServerProvisioningSpec'
    reconciliation:
      $ref: '#/components/schemas/ServerReconciliationSpec'
    networking:
      $ref: '#/components/schemas/ServerNetworkingSpec'

ServerBootSpec:
  type: object
  additionalProperties: false
  required: [isoRef]
  properties:
    isoRef: {$ref: '#/ServerDependencyReference'}

ServerDependencyReference:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name: {type: string, minLength: 1}
    uid: {type: string, minLength: 1}

ServerMachineSelector:
  type: object
  additionalProperties: false
  required: [location]
  properties:
    location:
      $ref: '#/components/schemas/MachineLocation'

ServerOperatingSystem:
  type: object
  additionalProperties: false
  required: [distribution, version, architecture, bootMode]
  properties:
    distribution: {type: string, minLength: 1}
    version: {type: string, minLength: 1}
    architecture:
      type: string
      enum: [amd64, arm64]
    bootMode:
      type: string
      enum: [bios, uefi]
    installationSource:
      $ref: '#/components/schemas/ServerInstallationSource'
    timezone: {type: string}
    locale: {type: string}
    kernelArguments:
      type: array
      items: {type: string}

ServerInstallationSource:
  type: object
  additionalProperties: false
  required: [url, checksum]
  properties:
    url: {type: string, format: uri}
    checksum:
      $ref: '#/components/schemas/ServerChecksum'

ServerChecksum:
  type: object
  additionalProperties: false
  required: [algorithm, value]
  properties:
    algorithm:
      type: string
      enum: [sha256, sha512]
    value: {type: string, minLength: 1}

ServerUser:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name: {type: string, minLength: 1}
    groups:
      type: array
      items: {type: string}
    shell: {type: string}
    locked: {type: boolean}
    ssh:
      $ref: '#/ServerUserSSHSpec'

ServerUserSSHSpec:
  type: object
  additionalProperties: false
  required: [authorizedKeyRefs]
  properties:
    authorizedKeyRefs:
      type: array
      items:
        $ref: '#/ServerSSHKeyPairReference'

ServerSSHKeyPairReference:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      minLength: 1

ServerFeatureFlags:
  type: object
  additionalProperties: false
  properties:
    daemon: {$ref: '#/components/schemas/ServerFeatureToggle'}
    monitoring: {$ref: '#/components/schemas/ServerFeatureToggle'}
    backup: {$ref: '#/components/schemas/ServerFeatureToggle'}
    kubernetes: {$ref: '#/components/schemas/ServerKubernetesFeature'}

ServerFeatureToggle:
  type: object
  additionalProperties: false
  required: [enabled]
  properties:
    enabled: {type: boolean}

ServerKubernetesFeature:
  type: object
  additionalProperties: false
  required: [enabled]
  properties:
    enabled: {type: boolean}
    role:
      type: string
      enum: [control-plane, worker]

ServerProvisioningSpec:
  type: object
  additionalProperties: false
  required: [enabled]
  properties:
    enabled: {type: boolean}
    reprovision: {type: integer, format: int64, minimum: 0, default: 0}
    targetDisk: {type: string, pattern: '^/dev/disk/by-id/[^/]+$'}

ServerReconciliationSpec:
  type: object
  additionalProperties: false
  required: [paused]
  properties:
    paused: {type: boolean}

ServerNetworkingSpec:
  type: object
  additionalProperties: false
  properties:
    management:
      $ref: '#/components/schemas/ServerManagementNetworkSpec'

ServerManagementNetworkSpec:
  type: object
  additionalProperties: false
  required: [interfaceSelector, addressSelector]
  properties:
    interfaceSelector:
      $ref: '#/components/schemas/ServerManagementInterfaceSelector'
    addressSelector:
      $ref: '#/components/schemas/ServerManagementAddressSelector'

ServerManagementInterfaceSelector:
  type: object
  additionalProperties: false
  required: [attachedAtMachineLocation]
  properties:
    attachedAtMachineLocation:
      type: boolean
      enum: [true]

ServerManagementAddressSelector:
  type: object
  additionalProperties: false
  required: [family, subnet]
  properties:
    family:
      type: string
      enum: [ipv4, ipv6]
    subnet:
      type: string
      minLength: 1

ServerStatus:
  type: object
  additionalProperties: false
  properties:
    phase: {type: string}
    machineRef: {$ref: '#/components/schemas/ResourceReference'}
    bootISORef: {$ref: '#/components/schemas/ResourceReference'}
    fqdn: {type: string}
    observedAddresses:
      type: array
      items: {type: string}
    agent: {$ref: '#/components/schemas/ServerAgentStatus'}
    provisioning: {$ref: '#/components/schemas/ServerProvisioningStatus'}
    resourceSummary: {$ref: '#/components/schemas/ServerResourceSummary'}
    features: {$ref: '#/components/schemas/ServerFeatureStatuses'}
    systemStats: {$ref: '#/components/schemas/ServerSystemStats'}
    networking: {$ref: '#/components/schemas/ServerNetworkingStatus'}
    ssh: {$ref: '#/components/schemas/ServerSSHStatus'}
    sshTrust: {$ref: '#/ServerSSHTrustStatus'}
    desiredSSHTrustBundleDigest: {type: string}
    installedSSHTrustBundleDigest: {type: string}
    hostSSH: {$ref: '#/ServerHostSSHStatus'}
    observedGeneration: {type: integer, format: int64, minimum: 0}
    conditions:
      type: array
      items: {$ref: '#/components/schemas/ServerCondition'}

ServerHostSSHStatus:
  type: object
  additionalProperties: false
  properties:
    keyPairRef: {$ref: '#/components/schemas/ResourceReference'}
    publicKey: {type: string}
    fingerprint: {type: string}
    keyReady: {type: boolean}
    bootstrapPublicKey: {type: string}
    installedKeyPairRef: {$ref: '#/components/schemas/ResourceReference'}
    installedFingerprint: {type: string}
    observedGeneration: {type: integer, format: int64, minimum: 0}
    phase: {type: string, enum: [Pending, BootstrapPinned, Ready, Failed, Conflict]}
    reason: {type: string}
    message: {type: string}

ServerSSHTrustStatus:
  type: object
  additionalProperties: false
  required: [authorityRef, publicBundle]
  properties:
    authorityRef: {$ref: '#/components/schemas/ResourceReference'}
    publicBundle: {type: string}

ServerAgentStatus:
  type: object
  additionalProperties: false
  required: [reachable]
  properties:
    reachable: {type: boolean}
    version: {type: string}
    lastSeenTime: {type: string, format: date-time}

ServerProvisioningStatus:
  type: object
  additionalProperties: false
  required: [provisioned]
  properties:
    provisioned: {type: boolean}
    observedReprovision: {type: integer, format: int64, minimum: 0}
    requestedReprovision: {type: integer, format: int64, minimum: 0}
    phase: {type: string, enum: [PreparingBoot, AwaitingLive, Installing, AwaitingInstalled, Verifying, Succeeded, Blocked]}
    maintenance: {type: boolean}
    bootTarget: {type: string, enum: [live, installed]}
    sourceBootID: {type: string}
    liveBootID: {type: string}
    netbootArmed: {type: boolean}
    bootstrapPublicKey: {type: string}
    snapshot: {$ref: '#/ServerProvisioningSnapshot'}
    attemptID: {type: string}
    attemptNumber: {type: integer, minimum: 0}
    observedServerGeneration: {type: integer, format: int64, minimum: 0}
    currentStage: {type: string}
    startedAt: {type: string, format: date-time}
    completedAt: {type: string, format: date-time}
    backendRunID: {type: string}
    message: {type: string}

ServerProvisioningSnapshot:
  type: object
  additionalProperties: false
  required: [serverUID, machineRef, keyPairRef, isoRef, authorityRef, trustBundleDigest, isoBuildID, distribution, artifacts, targetDisk, diskIdentity, bootMAC, inputs, codeRevision, planDigest]
  properties:
    serverUID: {type: string, minLength: 1}
    machineRef: {$ref: '#/components/schemas/ResourceReference'}
    keyPairRef: {$ref: '#/components/schemas/ResourceReference'}
    isoRef: {$ref: '#/components/schemas/ResourceReference'}
    authorityRef: {$ref: '#/components/schemas/ResourceReference'}
    trustBundleDigest: {type: string}
    isoBuildID: {type: string, minLength: 1}
    distribution: {type: string, enum: [arch, debian]}
    artifacts:
      type: array
      items: {$ref: '#/components/schemas/ISOArtifact'}
    targetDisk: {type: string, pattern: '^/dev/disk/by-id/[^/]+$'}
    diskIdentity: {type: object, additionalProperties: true}
    bootMAC: {type: string, pattern: '^[a-f0-9]{2}(:[a-f0-9]{2}){5}$'}
    inputs: {type: object, additionalProperties: true}
    codeRevision: {type: string, minLength: 1}
    planDigest: {type: string, minLength: 1}

ServerResourceSummary:
  type: object
  additionalProperties: false
  properties:
    diskClaims: {type: integer, minimum: 0}
    networkPortClaims: {type: integer, minimum: 0}
    interfaces: {type: integer, minimum: 0}
    addresses: {type: integer, minimum: 0}

ServerFeatureStatuses:
  type: object
  additionalProperties: false
  properties:
    daemon: {$ref: '#/components/schemas/ServerFeatureStatus'}
    monitoring: {$ref: '#/components/schemas/ServerFeatureStatus'}
    backup: {$ref: '#/components/schemas/ServerFeatureStatus'}
    kubernetes: {$ref: '#/components/schemas/ServerFeatureStatus'}

ServerFeatureStatus:
  type: object
  additionalProperties: false
  required: [installed, healthy]
  properties:
    installed: {type: boolean}
    healthy: {type: boolean}

ServerSystemStats:
  type: object
  additionalProperties: false
  properties:
    cpuPercent: {type: number, minimum: 0, maximum: 100}
    memoryPercent: {type: number, minimum: 0, maximum: 100}
    loadAverage1m: {type: number, minimum: 0}

ServerNetworkingStatus:
  type: object
  additionalProperties: false
  properties:
    management:
      $ref: '#/components/schemas/ServerManagementNetworkStatus'

ServerManagementNetworkStatus:
  type: object
  additionalProperties: false
  required: [interface, address, reason]
  properties:
    interface:
      $ref: '#/components/schemas/ServerManagementInterfaceStatus'
    address:
      $ref: '#/components/schemas/ServerManagementAddressStatus'
    reason: {type: string, minLength: 1}

ServerManagementInterfaceStatus:
  type: object
  additionalProperties: false
  required: [name, mac]
  properties:
    name: {type: string, minLength: 1}
    mac: {type: string}

ServerManagementAddressStatus:
  type: object
  additionalProperties: false
  required: [address, family, prefixLength]
  properties:
    address: {type: string, minLength: 1}
    family:
      type: string
      enum: [ipv4, ipv6]
    prefixLength: {type: integer, minimum: 0, maximum: 128}

ServerSSHStatus:
  type: object
  additionalProperties: false
  required: [authorizedKeys]
  properties:
    authorizedKeys:
      type: array
      items:
        $ref: '#/components/schemas/ServerSSHAuthorizedKeyStatus'

ServerSSHAuthorizedKeyStatus:
  type: object
  additionalProperties: false
  required: [keyPairRef, loginUser, publicKey, fingerprint]
  properties:
    keyPairRef:
      $ref: '#/components/schemas/ResourceReference'
    loginUser:
      type: string
      minLength: 1
    publicKey:
      type: string
      minLength: 1
    fingerprint:
      type: string
      minLength: 1

ServerCondition:
  type: object
  additionalProperties: false
  required: [type, status, reason]
  properties:
    type: {type: string, minLength: 1}
    status:
      type: string
      enum: ['True', 'False', Unknown]
    reason: {type: string, minLength: 1}
    message: {type: string}
    lastTransitionTime: {type: string, format: date-time}
    observedGeneration: {type: integer, format: int64, minimum: 0}
