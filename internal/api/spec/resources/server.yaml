# Server is the user-named desired host configuration bound to one discovered Machine.
x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: Server
  plural: servers
  spec-schema: ServerSpec
  status-schema: ServerStatus
  operations: [create, list, get, put, patch, delete, delete-collection]

ServerSpec:
  type: object
  additionalProperties: false
  required: [machineSelector]
  properties:
    machineSelector:
      $ref: '#/components/schemas/ServerMachineSelector'
    hostName: {type: string, minLength: 1}
    domainName: {type: string, minLength: 1}
    operatingSystem:
      $ref: '#/components/schemas/ServerOperatingSystem'
    users:
      type: array
      items:
        $ref: '#/components/schemas/ServerUser'
    groups:
      type: array
      items: {type: string}
    packages:
      type: array
      items: {type: string}
    sysctls:
      type: object
      additionalProperties: {type: string}
    featureFlags:
      $ref: '#/components/schemas/ServerFeatureFlags'
    provisioning:
      $ref: '#/components/schemas/ServerProvisioningSpec'
    reconciliation:
      $ref: '#/components/schemas/ServerReconciliationSpec'
    networking:
      $ref: '#/components/schemas/ServerNetworkingSpec'

ServerMachineSelector:
  type: object
  additionalProperties: false
  required: [location]
  properties:
    location:
      $ref: '#/components/schemas/MachineLocation'

ServerOperatingSystem:
  type: object
  additionalProperties: false
  required: [distribution, version, architecture, bootMode]
  properties:
    distribution: {type: string, minLength: 1}
    version: {type: string, minLength: 1}
    architecture:
      type: string
      enum: [amd64, arm64]
    bootMode:
      type: string
      enum: [bios, uefi]
    installationSource:
      $ref: '#/components/schemas/ServerInstallationSource'
    timezone: {type: string}
    locale: {type: string}
    kernelArguments:
      type: array
      items: {type: string}

ServerInstallationSource:
  type: object
  additionalProperties: false
  required: [url, checksum]
  properties:
    url: {type: string, format: uri}
    checksum:
      $ref: '#/components/schemas/ServerChecksum'

ServerChecksum:
  type: object
  additionalProperties: false
  required: [algorithm, value]
  properties:
    algorithm:
      type: string
      enum: [sha256, sha512]
    value: {type: string, minLength: 1}

ServerUser:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name: {type: string, minLength: 1}
    groups:
      type: array
      items: {type: string}
    shell: {type: string}
    locked: {type: boolean}

ServerFeatureFlags:
  type: object
  additionalProperties: false
  properties:
    daemon: {$ref: '#/components/schemas/ServerFeatureToggle'}
    monitoring: {$ref: '#/components/schemas/ServerFeatureToggle'}
    backup: {$ref: '#/components/schemas/ServerFeatureToggle'}
    kubernetes: {$ref: '#/components/schemas/ServerKubernetesFeature'}

ServerFeatureToggle:
  type: object
  additionalProperties: false
  required: [enabled]
  properties:
    enabled: {type: boolean}

ServerKubernetesFeature:
  type: object
  additionalProperties: false
  required: [enabled]
  properties:
    enabled: {type: boolean}
    role:
      type: string
      enum: [control-plane, worker]

ServerProvisioningSpec:
  type: object
  additionalProperties: false
  required: [enabled]
  properties:
    enabled: {type: boolean}

ServerReconciliationSpec:
  type: object
  additionalProperties: false
  required: [paused]
  properties:
    paused: {type: boolean}

ServerNetworkingSpec:
  type: object
  additionalProperties: false
  properties:
    management:
      $ref: '#/components/schemas/ServerManagementNetworkSpec'

ServerManagementNetworkSpec:
  type: object
  additionalProperties: false
  required: [interfaceSelector, addressSelector]
  properties:
    interfaceSelector:
      $ref: '#/components/schemas/ServerManagementInterfaceSelector'
    addressSelector:
      $ref: '#/components/schemas/ServerManagementAddressSelector'

ServerManagementInterfaceSelector:
  type: object
  additionalProperties: false
  required: [attachedAtMachineLocation]
  properties:
    attachedAtMachineLocation:
      type: boolean
      enum: [true]

ServerManagementAddressSelector:
  type: object
  additionalProperties: false
  required: [family, subnet]
  properties:
    family:
      type: string
      enum: [ipv4, ipv6]
    subnet:
      type: string
      minLength: 1

ServerStatus:
  type: object
  additionalProperties: false
  properties:
    phase: {type: string}
    machineRef: {$ref: '#/components/schemas/ResourceReference'}
    fqdn: {type: string}
    observedAddresses:
      type: array
      items: {type: string}
    agent: {$ref: '#/components/schemas/ServerAgentStatus'}
    provisioning: {$ref: '#/components/schemas/ServerProvisioningStatus'}
    resourceSummary: {$ref: '#/components/schemas/ServerResourceSummary'}
    features: {$ref: '#/components/schemas/ServerFeatureStatuses'}
    systemStats: {$ref: '#/components/schemas/ServerSystemStats'}
    networking: {$ref: '#/components/schemas/ServerNetworkingStatus'}
    ssh: {$ref: '#/components/schemas/ServerSSHStatus'}
    observedGeneration: {type: integer, format: int64, minimum: 0}
    conditions:
      type: array
      items: {$ref: '#/components/schemas/ServerCondition'}

ServerAgentStatus:
  type: object
  additionalProperties: false
  required: [reachable]
  properties:
    reachable: {type: boolean}
    version: {type: string}
    lastSeenTime: {type: string, format: date-time}

ServerProvisioningStatus:
  type: object
  additionalProperties: false
  required: [provisioned]
  properties:
    provisioned: {type: boolean}
    phase: {type: string}
    attemptID: {type: string}
    attemptNumber: {type: integer, minimum: 0}
    observedServerGeneration: {type: integer, format: int64, minimum: 0}
    currentStage: {type: string}
    startedAt: {type: string, format: date-time}
    completedAt: {type: string, format: date-time}
    backendRunID: {type: string}
    message: {type: string}

ServerResourceSummary:
  type: object
  additionalProperties: false
  properties:
    diskClaims: {type: integer, minimum: 0}
    networkPortClaims: {type: integer, minimum: 0}
    interfaces: {type: integer, minimum: 0}
    addresses: {type: integer, minimum: 0}

ServerFeatureStatuses:
  type: object
  additionalProperties: false
  properties:
    daemon: {$ref: '#/components/schemas/ServerFeatureStatus'}
    monitoring: {$ref: '#/components/schemas/ServerFeatureStatus'}
    backup: {$ref: '#/components/schemas/ServerFeatureStatus'}
    kubernetes: {$ref: '#/components/schemas/ServerFeatureStatus'}

ServerFeatureStatus:
  type: object
  additionalProperties: false
  required: [installed, healthy]
  properties:
    installed: {type: boolean}
    healthy: {type: boolean}

ServerSystemStats:
  type: object
  additionalProperties: false
  properties:
    cpuPercent: {type: number, minimum: 0, maximum: 100}
    memoryPercent: {type: number, minimum: 0, maximum: 100}
    loadAverage1m: {type: number, minimum: 0}

ServerNetworkingStatus:
  type: object
  additionalProperties: false
  properties:
    management:
      $ref: '#/components/schemas/ServerManagementNetworkStatus'

ServerManagementNetworkStatus:
  type: object
  additionalProperties: false
  required: [interface, address, reason]
  properties:
    interface:
      $ref: '#/components/schemas/ServerManagementInterfaceStatus'
    address:
      $ref: '#/components/schemas/ServerManagementAddressStatus'
    reason: {type: string, minLength: 1}

ServerManagementInterfaceStatus:
  type: object
  additionalProperties: false
  required: [name, mac]
  properties:
    name: {type: string, minLength: 1}
    mac: {type: string}

ServerManagementAddressStatus:
  type: object
  additionalProperties: false
  required: [address, family, prefixLength]
  properties:
    address: {type: string, minLength: 1}
    family:
      type: string
      enum: [ipv4, ipv6]
    prefixLength: {type: integer, minimum: 0, maximum: 128}

ServerSSHStatus:
  type: object
  additionalProperties: false
  required: [authorizedKeys]
  properties:
    authorizedKeys:
      type: array
      items:
        $ref: '#/components/schemas/ServerSSHAuthorizedKeyStatus'

ServerSSHAuthorizedKeyStatus:
  type: object
  additionalProperties: false
  required: [accessGrantRef, loginUser, publicKey, fingerprint]
  properties:
    accessGrantRef:
      $ref: '#/components/schemas/ResourceReference'
    loginUser:
      type: string
      minLength: 1
    publicKey:
      type: string
      minLength: 1
    fingerprint:
      type: string
      minLength: 1

ServerCondition:
  type: object
  additionalProperties: false
  required: [type, status, reason]
  properties:
    type: {type: string, minLength: 1}
    status:
      type: string
      enum: ['True', 'False', Unknown]
    reason: {type: string, minLength: 1}
    message: {type: string}
    lastTransitionTime: {type: string, format: date-time}
    observedGeneration: {type: integer, format: int64, minimum: 0}
