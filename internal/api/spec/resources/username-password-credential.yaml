# SSHKeyPair declares one reusable SSH key pair backed by a Secret resource.
x-stigmergy-resource:
  api-version: homelab.io/v1alpha1
  path-prefix: /api/v1alpha1
  kind: UsernamePasswordCredential
  plural: username-password-credentials
  spec-schema: UsernamePasswordCredentialSpec
  status-schema: UsernamePasswordCredentialStatus
  operations: [create, list, get, put, patch, delete, delete-collection]
  finalizers: [homelab.io/username-password-cleanup]

UsernamePasswordCredentialSpec:
  type: object
  additionalProperties: false
  required: [username, pasword, secretStoreRef]
  properties:
    username:
      type: string
      minLength: 1
    password:
      type: string
      minLength: 1
    secretStoreRef:
      $ref: '#/UsernamePasswordCredentialSecretStoreReference'
    path:
      type: string
      minLength: 1
      default: username-password-creds

UsernamePasswordCredentialSecretStoreReference:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      minLength: 1

UsernamePasswordCredentialStatus:
  type: object
  additionalProperties: false
  properties:
    phase:
      type: string
      enum: [Pending, Ready, Conflict, Failed]
    observedGeneration:
      type: integer
      format: int64
      minimum: 0
    secretRef:
      $ref: '#/components/schemas/ResourceReference'
    conditions:
      type: array
      items:
        $ref: '#/UsernamePasswordCredentialCondition'

UsernamePasswordCredentialCondition:
  type: object
  additionalProperties: false
  required: [type, status, reason]
  properties:
    type: {type: string, minLength: 1}
    status:
      type: string
      enum: ['True', 'False', Unknown]
    reason: {type: string, minLength: 1}
    message: {type: string}
    observedGeneration: {type: integer, format: int64, minimum: 0}
